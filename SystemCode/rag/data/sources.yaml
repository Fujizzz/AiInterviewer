    clean_profile: html
    options:
      crawl:
        static_version: "2026-10-16"
        version_prefix: "snapshot-"
        permalink: {append: "#{version}"}
        prefix: "https://trac.ffmpeg.org/wiki/"
        start_urls:
          - "https://trac.ffmpeg.org/wiki/Encode/H.264"
          - "https://trac.ffmpeg.org/wiki/Encode/H.265"
          - "https://trac.ffmpeg.org/wiki/Encode/VP9"
          - "https://trac.ffmpeg.org/wiki/Encode/AV1"
          - "https://trac.ffmpeg.org/wiki/FilteringGuide"
          - "https://trac.ffmpeg.org/wiki/Scaling"
          - "https://trac.ffmpeg.org/wiki/Seeking"
          - "https://trac.ffmpeg.org/wiki/ChromaSubsampling"
          - "https://trac.ffmpeg.org/wiki/HWAccelIntro"
          - "https://trac.ffmpeg.org/wiki/Concatenate"
          - "https://trac.ffmpeg.org/wiki/Create%20a%20thumbnail%20image%20every%20X%20seconds%20of%20the%20video"
          - "https://trac.ffmpeg.org/wiki/Null"
          - "https://trac.ffmpeg.org/wiki/Map"
        delay_seconds: 1.5
        max_pages: 16
        main_selectors: ["#wikipage"]
        strip_selectors: [".trac-nav", "#pagepath", ".buttons", "#attachments", ".trac-modifiedby"]
        allow:
          - "Encode/H.264"
          - "Encode/H.265"
          - "Encode/VP9"
          - "Encode/AV1"
          - "FilteringGuide"
          - "Scaling"
          - "Seeking"
          - "ChromaSubsampling"
          - "HWAccelIntro"
          - "Concatenate"
          - "Create%20a%20thumbnail%20image%20every%20X%20seconds%20of%20the%20video"
          - "Null"
          - "Map"
    notes: >
      FFmpeg Wiki community guides (CC BY-SA 3.0 per the wiki's licence notice): H.264/H.265/VP9/AV1 encoding
      (CRF, presets, GOP/keyframes), filtering, scaling, seeking, chroma subsampling, hardware acceleration.

