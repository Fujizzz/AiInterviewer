    url: https://trac.ffmpeg.org/wiki
    loader: crawler
    license: "CC-BY-SA-3.0 (FFmpeg Wiki, Community Contributed Documentation)"
    auto_level: full
    trust_level: curated
    refresh_cycle: never
    domain: computer-vision
    related_technologies: [ffmpeg, h264, h265, video-encoding, crf, gop, chroma-subsampling, hardware-acceleration]
