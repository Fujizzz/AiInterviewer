# Off-topic / unanswerable queries for calibrating the retrieval confidence rule.
# The corpus is software-engineering docs, papers and interview prep; nothing here should be
# answerable from it, so a correct system reports LOW confidence ("no evidence") for all of them.
# `in_domain_non_ascii` are the opposite: answerable queries written in Chinese. They are NOT part
# of the negative set; they document that lexical search is ASCII-only (lexical_hit=False) while dense
# retrieval still works.
status: "draft — needs human review"
negative:
  - {id: n01, category: cooking,  query: "sourdough starter feeding schedule"}
  - {id: n02, category: cooking,  query: "pizza"}              # NOTE: the corpus has a LeetCode problem "Pizza With 3n Slices", so a literal hit is legitimate
