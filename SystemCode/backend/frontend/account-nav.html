<!--
Responsibilities: Provide account navigation shared by product pages.
Implementation: Render authenticated profile/logout controls or anonymous login/register links; Django escapes identity and supplies CSRF for POST logout.
Related Modules: workspace-nav.html, workspace.css, account.css and i18n.js; accounts.py owns authentication.
Declaration Index:
None
Variable Index:
None
Template Context:
user determines authentication and escaped identity; csrf_token authorizes the logout POST.
Constraints:
Native details changes menu visibility only. Styling truncates long names while the escaped title retains the complete name. No credentials or account state are stored in the browser.
-->
{% if user.is_authenticated %}
<details class="workspace-account">
  <summary title="{{ user.username }}">{{ user.username }}</summary>
  <div class="workspace-account-menu">
    <a href="/resumes/#profile-panel" data-i18n="rm_account">Personal information</a>
    <form method="post" action="/logout/">{% csrf_token %}<button type="submit" class="account-logout" data-i18n="auth_logout">Sign out</button></form>
  </div>
</details>
{% else %}
<div class="account-nav"><a href="/login/" data-i18n="auth_login">Sign in</a><a class="account-register-link" href="/register/" data-i18n="auth_register">Sign up</a></div>
{% endif %}
