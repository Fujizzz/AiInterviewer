<!--
Responsibilities: Provide shared navigation for Overview, Mock interview, My resumes, Job matches and Interview review.
Implementation: Django marks the current route; resumes.js handles the job panel; native details provides the account menu.
Related Modules: workspace.css, account-nav.html and i18n.js; this template performs no business requests.
Declaration Index:
None
Variable Index:
None
Template Context:
request.path controls initial aria-current; user/csrf_token is passed to account navigation.
Element Index:
interview-language retains the interview scripts' language-selector event contract; workspace links identify resume/job panels.
Constraints:
Review keeps its standalone top-level route. All links are same-origin; narrow-screen navigation scrolls within its own region. Initial system labels are English; explicit language selection remains available.
-->
<header class="workspace-header">
  <a class="workspace-brand" href="/"><span aria-hidden="true">ai</span> Interviewer</a>
  <nav class="workspace-navigation" aria-label="Page navigation" data-i18n-attr="aria-label:nav_label">
    <a href="/" data-i18n="ws_overview"{% if request.path == "/" %} aria-current="page"{% endif %}>Overview</a>
    <a href="/agent/" data-i18n="ws_practice"{% if request.path == "/agent/" or request.path == "/stream-demo/agent.html" %} aria-current="page"{% endif %}>Mock interview</a>
    <a href="/resumes/" data-workspace-link="resume-files" data-i18n="ws_resumes"{% if request.path == "/resumes/" or request.path == "/stream-demo/resumes.html" %} aria-current="page"{% endif %}>My resumes</a>
    <a href="/resumes/#job-recommendations" data-workspace-link="job-recommendations" data-i18n="ws_jobs">Job matches</a>
    <a href="/interview-review/" data-i18n="review_nav"{% if request.path == "/interview-review/" or request.path == "/stream-demo/interview-review.html" %} aria-current="page"{% endif %}>Interview review</a>
  </nav>
  <div class="workspace-utilities">
    <label class="language-picker"><span class="visually-hidden" data-language-label>Language</span><select id="interview-language" data-language-selector aria-label="Language" data-i18n-attr="aria-label:language"><option value="system" data-i18n="language_system">Follow system</option><option value="zh" data-i18n="language_zh">Chinese</option><option value="en" data-i18n="language_en">English</option></select></label>
    {% include "account-nav.html" %}
  </div>
</header>
