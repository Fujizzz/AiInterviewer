# Responsibilities: package metadata and explicit application/development/semantic-gate dependencies.
# Implementation: the completion-gate extra installs CPU inference only; training stays on Kaggle.
# Related Modules: backend/requirements.txt pins the same runtime; training/answer_completion exports.
# Declaration Index: None. Variable Index: project.optional-dependencies.completion-gate enables
# NumPy features, ONNX Runtime and tokenizer support; existing application versions are unchanged.
[project]
name = "ai-interviewer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.54,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1.2,<2",
    "pypdf>=6.18,<7",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
completion-gate = [
    "numpy==2.0.2",
    "onnxruntime==1.23.2",
    "tokenizers==0.22.2",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["UP042"]
select = ["E", "F", "I", "UP", "B"]
