agent:
  policy_config_version: dialogue-policy-v2
  max_questions_per_project: 4
  max_questions_per_topic: 3
  min_question_difficulty: 1
  max_question_difficulty: 5
  initial_question_difficulty: 2
  difficulty:
    strong_evidence_threshold: 0.80
    strong_relevance_threshold: 0.80
  probe:
    minimum_remaining_seconds: 60
    max_no_information_answers: 2
  project_selector:
    job_relevance_weight: 0.60
    detail_weight: 0.40
    visit_penalty_weight: 0.20
  retrieval:
    candidate_top_k: 4
    technical_top_k: 5
    question_top_k: 3
    job_top_k: 3
  context:
    candidate_chunks: 4
    technical_chunks: 5
    question_chunks: 3
    job_chunks: 3
    recent_questions: 3
    recent_feedback: 3
  question_validation:
    minimum_words: 4
    maximum_words: 110
    maximum_question_marks: 1
  timeouts:
    rag_seconds: 2.0
    evaluation_seconds: 30.0
    llm_generation_seconds: 30.0
    repository_seconds: 1.0
  retries:
    llm_generation_retries: 3
    state_conflict_recomputations: 1
  question_agent:
    enabled: true
    quality_timeout_seconds: 20.0
    max_tool_calls: 2
    total_timeout_seconds: 90.0
    history_retention: 50
    history_tool_limit: 10
    text_char_limit: 4000
