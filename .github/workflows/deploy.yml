# Responsibilities: Verify SystemCode and deploy main to the existing Ubuntu service.
# Implementation: Run commands from SystemCode; export that Git subtree as the release root,
# then append the exact browser bundle verified in this workflow run. Server paths stay stable.
# Related Modules: SystemCode/deploy/deploy-release.py and SystemCode/deploy/smoke.py.
# Declaration Index: None.
# Variable Index: defaults.run.working-directory selects the application root; verify/deploy
# are jobs; REVISION selects the immutable source tree; DEPLOY_SSH_KEY/DEPLOY_KNOWN_HOSTS
# are secret SSH credentials and host identity, never printed to the workflow log.
name: Verify and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-main
  cancel-in-progress: false
defaults:
  run:
    working-directory: SystemCode
jobs:
  verify:
    runs-on: ubuntu-22.04
    env:
      DJANGO_SECRET_KEY: ci-only-non-production-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install locked runtime and test tools
        run: |
          python -m venv .runtime
          .runtime/bin/python -m pip install --no-deps -r deploy/requirements-linux.lock.txt
          .runtime/bin/python -m pip check
          .runtime/bin/python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
          echo "$PWD/.runtime/bin" >> "$GITHUB_PATH"
      - name: Build locked avatar browser module
        working-directory: SystemCode/backend/frontend/digital-human
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          node --check dist/pixel-player.js
      - name: Validate avatar module contract
        run: python deploy/smoke.py --check-frontend-bundle
      - name: Core tests
        run: python -m pytest -q
      - name: Backend tests
        working-directory: SystemCode/backend
        run: python manage.py test interviews --noinput
      - name: Browser client tests
        run: node --test backend/tests/*.test.mjs backend/frontend/digital-human/tests/*.test.mjs
      - name: Preserve verified avatar module
        uses: actions/upload-artifact@v4
        with:
          name: digital-human-player-${{ github.sha }}
          path: SystemCode/backend/frontend/digital-human/dist/pixel-player.js
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download avatar module from this verified run
        uses: actions/download-artifact@v4
        with:
          name: digital-human-player-${{ github.sha }}
          path: SystemCode/backend/frontend/digital-human/dist
      - name: Assemble verified release archive
        env:
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python deploy/smoke.py --check-frontend-bundle
          git -C "$GITHUB_WORKSPACE" archive --format=tar --output="$RUNNER_TEMP/source.tar" "$REVISION:SystemCode"
          tar --append --file="$RUNNER_TEMP/source.tar" -- backend/frontend/digital-human/dist/pixel-player.js
          python deploy/smoke.py --check-release-bundle "$RUNNER_TEMP/source.tar"
      - name: Deploy verified commit
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          gzip --stdout "$RUNNER_TEMP/source.tar" | ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes ai-deploy@47.239.50.129 "deploy $REVISION"
      - name: Verify public HTTPS
        run: curl --fail --silent --show-error https://47.239.50.129/login/ --output /dev/null
