# 职责：为指定 IP 提供 HTTPS 及 HTTP/WebSocket 反向代理，账号认证由 Django 完成。
# 实现：80 仅开放 ACME 和 HTTPS 跳转；443 把 session Cookie 原样传递给应用。
# 关联：production.py 启用账号门禁及同源/CSRF 检查；Certbot 单独签发并续期。
# 目录：无函数/类。变量索引：$http_upgrade/$connection_upgrade 用于 WebSocket 升级。
# 部署到其他地址时必须同步修改 server_name、跳转目标、证书路径和 app.env。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name 47.239.50.129;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ai-interviewer-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://47.239.50.129$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 47.239.50.129;
    ssl_certificate /etc/letsencrypt/live/47.239.50.129/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.239.50.129/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    if ($host != '47.239.50.129') { return 444; }

    # 正文大小继续由原有 ASGI 容量层检查，避免代理改变 413 响应契约。
    client_max_body_size 0;
    access_log /var/log/nginx/ai-interviewer.access.log combined;
    error_log /var/log/nginx/ai-interviewer.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 删除外部转发地址，使应用始终检查真实同机代理；来源仍由 Origin 原样校验。
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        # 应用仅使用 session Cookie；清除浏览器可能缓存的旧 Basic Authorization 头。
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
