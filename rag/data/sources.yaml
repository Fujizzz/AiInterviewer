# IntelliHire RAG data source registry.
#
# Every source consumed by the pipeline (or planned for later) MUST be
# registered here, even if its loader is not implemented yet. Unimplemented
# loaders (`crawler`, `manual`) are expected to print "not implemented /
# manual" and skip cleanly — see rag/loaders/base.py.
#
# Fields:
#   name             unique id, used as filename stem under data/raw|clean|chunks
#   namespace        candidate|job|technical|rubric|question|test
#   priority         P0|P1|P2
#   url              canonical homepage / repo / dataset / paper URL
#   loader           git|hf|arxiv|crawler|xlsx|manual
#   path / paths     (git) sparse-checkout subdir(s) actually containing docs
#   license          license string; CC-NC / no-license called out explicitly
#   auto_level       full|semi|manual  (how much of the fetch is automatable)
#   trust_level      official|curated|community|reference_only
#   refresh_cycle    how often this should be re-fetched
#   domain           broad subject area
#   related_technologies  list of tags
#   include/exclude  (git: repo-relative paths; crawler: paths relative to crawl.prefix)
#                    glob lists. `*` = one path segment, `**` = any depth, `{a,b}` = alternation.
#                    Directory excludes (`dir/**`) are also pushed into the git sparse-checkout
#                    so excluded blobs are never downloaded.
#   max_file_kb      skip individual source files larger than this (generated pages)
#   clean_profile    markdown|rst|d2l|mintlify|hugo|html - source-specific markup conversion
#                    applied before the generic cleaner (see rag/profiles.py)
#   options          loader-specific: git {py_gallery, exts}, hf {files, dedupe_against},
#                    crawler {crawl: prefix/start_urls/allow/deny/main_selectors/...},
#                    xlsx {parser, glob}
#   reference_only   true => loader must refuse to chunk full text (metadata only)
#   verified         whether the repo/dataset/paper identity was confirmed to
#                    exist via `git ls-remote` / HF API / arXiv API during
#                    registry construction (2026-10-02). false = could not be
#                    confirmed, needs a human to verify before first use.
#   notes            free-text caveats (path accuracy, license nuance, etc.)

sources:

  # ============================================================
  # P0 — technical (git docs)
  # ============================================================
  - name: transformers
    namespace: technical
    priority: P0
    url: https://github.com/huggingface/transformers
    loader: git
    # Tree-verified (git ls-tree, 2026-10-02): docs/source/en has 755 md files, of
    # which 531 are auto-generated per-model pages under model_doc/.
    paths:
      - "docs/source/en/*.md"
      - "docs/source/en/main_classes/"
      - "docs/source/en/tasks/"
      - "docs/source/en/quantization/"
      - "docs/source/en/model_doc/{bert,gpt2,t5,llama,vit,clip}.md"
    include:
      - "docs/source/en/*.md"
      - "docs/source/en/main_classes/**"
      - "docs/source/en/tasks/**"
      - "docs/source/en/quantization/{overview,concept_guide,selecting,bitsandbytes,gptq,awq}.md"
      - "docs/source/en/model_doc/{bert,gpt2,t5,llama,vit,clip}.md"
    exclude:
      # contributor / maintainer docs
      - "docs/source/en/{contributing,add_new_model,add_new_pipeline,add_vision_processing_components,add_audio_processing_components,modular_transformers,modeling_rules,pr_checks,testing,how_to_hack_models,custom_models,community,notebooks,auto_docstring,monkey_patching,fusion_mapping,weightconverter,model_output_tracing,heterogeneous_configurations}.md"
      # release-style / index pages
      - "docs/source/en/{models_timeline,index}.md"
      # hardware-specific (Gaudi / special accelerators)
      - "docs/source/en/{perf_train_gaudi,perf_train_special,deepspeed_alst}.md"
    max_file_kb: 120
    license: Apache-2.0
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: ml-engineering
    related_technologies: [transformers, nlp, pytorch, huggingface]
    reference_only: false
    verified: true
    notes: >
      English only (docs/source/en; i18n dirs are siblings and never fetched).
      Inclusion decision: keep conceptual/how-to top-level guides, main_classes/
      (Trainer, pipelines, tokenizer, generation...), tasks/ guides and the
      core quantization guides (overview/concept/selecting + the 3 most common
      methods). model_doc/ is 531 auto-generated per-model API stubs (identical
      template, mostly autodoc blocks) -> excluded except a 6-page cap of
      canonical architectures (bert, gpt2, t5, llama, vit, clip) as
      representative examples. Contributor docs (contributing, add_new_model,
      modular_transformers, testing, pr_checks...), the models timeline,
      Gaudi/special-hardware pages and internal/ (auto-generated utils API)
      are excluded.

  - name: vllm
    namespace: technical
    priority: P0
    url: https://github.com/vllm-project/vllm
    loader: git
    path: docs
    license: Apache-2.0
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: ml-serving
    related_technologies: [vllm, llm-serving, inference, pagedattention]
    reference_only: false
    verified: true
    notes: >
      Confirmed: docs/ contains 238 md files at HEAD a810316c0894b8a43e53458ae5b14c9ad0b18b5d.
      Actually run (see reports). KNOWN LIMITATION: vllm's docs use
      pymdownx.snippets `--8<-- "path[:section]"` includes pointing at ~40
      files outside docs/ (mostly vllm/**/*.py source files, e.g.
      vllm/envs.py, vllm/model_executor/layers/*.py). git_loader widens the
      sparse-checkout on demand to pull in whichever of those files are
      referenced and inlines them (or the named start/end-marker section)
      when the result is small enough to be a sane chunk
      (<= SNIPPET_INLINE_MAX_TOKENS = 2000 tokens, see git_loader.py); larger
      targets (e.g. vllm/envs.py's full `env-vars-definition` section is
      ~21k tokens) are left as a stripped directive instead of becoming one
      giant un-splittable fenced-code chunk. Counts of resolved/stripped are
      reported per run (fetch_errors in the json report carry a
      "snippet-include (--8<--): ..." summary line).

  - name: langgraph
    namespace: technical
    priority: P0
    url: https://github.com/langchain-ai/docs
    loader: git
    # Tree-verified: LangGraph docs live in the unified langchain-ai/docs repo,
    # src/oss/langgraph/*.mdx (45 files) — NOT in langchain-ai/langgraph.
    paths: ["src/oss/langgraph/"]
    include: ["src/oss/langgraph/**"]
    exclude:
      - "src/oss/langgraph/changelog-*.mdx"
      - "src/oss/langgraph/frontend/**"
      - "src/oss/langgraph/case-studies.mdx"
    max_file_kb: 150      # raised from 100: add-memory.mdx (102 KB) and use-graph-api.mdx (124 KB) are core LangGraph docs
    clean_profile: mintlify
    license: MIT
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: agent-frameworks
    related_technologies: [langgraph, agents, llm-orchestration]
    reference_only: false
    verified: true
    notes: >
      Python-flavoured content only: Mintlify `:::python` / `:::js` conditional
      blocks are resolved keeping Python and dropping JS-only blocks
      (clean_profile: mintlify). Changelogs, frontend/UI integration pages and
      customer case studies excluded (not Q&A material). The 6 errors/*.mdx pages
      (GRAPH_RECURSION_LIMIT etc.) are kept: short, concrete failure modes.

  - name: llama_index
    namespace: technical
    priority: P0
    url: https://github.com/run-llama/llama_index
    loader: git
    # Tree-verified: docs/ = api_reference/ (754 generated mkdocs stubs),
    # examples/ (671 notebooks) and src/content/docs/framework (hand-written
    # guides, 155 md + 28 mdx). Only the hand-written guides are taken.
    paths: ["docs/src/content/docs/framework/"]
    include: ["docs/src/content/docs/framework/**"]
    exclude:
      - "docs/src/content/docs/framework/_static/**"
      - "docs/src/content/docs/framework/presentations/**"
      - "docs/src/content/docs/framework/community/integrations/**"
      - "docs/src/content/docs/framework/community/llama_packs/**"
      - "docs/src/content/docs/framework/module_guides/llama_deploy/**"
      - "**/CHANGELOG*"
      - "**/*.ipynb"
    max_file_kb: 100
    clean_profile: mintlify
    license: MIT
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: rag-frameworks
    related_technologies: [llama_index, rag, retrieval]
    reference_only: false
    verified: true
    notes: >
      Original path `docs` pulled 1600+ files, ~2/3 auto-generated api_reference
      stubs and example notebooks -> narrowed to the hand-written framework
      guides (understanding/, module_guides/, optimizing/, getting started).
      Integration catalogue pages, llama_pack listings, slide materials and
      llama_deploy (separate product) excluded.

  - name: d2l-en
    namespace: technical
    priority: P0
    url: https://github.com/d2l-ai/d2l-en
    loader: git
    # Tree-verified: content = chapter_*/*.md at repo root (d2lbook markdown with
    # mxnet/pytorch/tensorflow/jax tabs).
    paths: ["chapter_*/"]
    include: ["chapter_*/*.md"]
    exclude:
      - "chapter_{references,installation,notation,preface}/**"
      - "chapter_appendix-tools-for-deep-learning/**"
      - "chapter_*/index.md"
    max_file_kb: 200
    clean_profile: d2l
    license: CC-BY-SA-4.0
    auto_level: full
    trust_level: official
    refresh_cycle: quarterly
    domain: deep-learning-theory
    related_technologies: [deep-learning, math, pytorch]
    reference_only: false
    verified: true
    notes: >
      English only (the repo is the English edition). clean_profile d2l keeps the
      PyTorch variant only: `%%tab` code cells for mxnet/tensorflow/jax and
      `:begin_tab:` prose blocks for other frameworks are dropped, `%%tab`
      markers/`#@save` stripped, d2lbook cross-ref roles (:label:/:numref:/:eqref:/
      :cite:) rewritten or removed. Per-chapter index.md (toctree only),
      references/installation/notation/preface and the tooling appendix
      (AWS/Colab/contributing) excluded.

  - name: pytorch-tutorials
    namespace: technical
    priority: P0
    url: https://github.com/pytorch/tutorials
    loader: git
    # Tree-verified: *_source/ dirs hold both .rst pages and sphinx-gallery .py
    # tutorials (code + reST comments). Both are taken; .py is converted to
    # text+fenced-code by the `py_gallery` option.
    paths: ["beginner_source/", "intermediate_source/", "recipes_source/", "advanced_source/"]
    include: ["{beginner,intermediate,recipes,advanced}_source/**"]
    exclude:
      - "**/*index.rst"
      - "**/*_index.rst"
      - "**/README*"
      - "**/data/**"
      - "**/_static/**"
    options:
      py_gallery: true
    max_file_kb: 100
    clean_profile: rst
    license: BSD-3-Clause
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: ml-engineering
    related_technologies: [pytorch, deep-learning]
    reference_only: false
    verified: true
    notes: >
      Used pytorch/tutorials (task fallback) because pytorch/pytorch docs/source is
      Sphinx autodoc. unstable_source (prototype features) excluded by not being
      listed in `paths`; toctree-only index pages excluded.

  - name: system-design-primer
    namespace: technical
    priority: P0
    url: https://github.com/donnemartin/system-design-primer
    loader: git
    paths: ["README.md", "solutions/system_design"]
    exclude:
      # every translation (README-zh-Hans.md, README-ja.md, ...) — 92 of 245 chunks were Chinese
      - "**/README-*.md"
      - "**/*-{zh,zh-Hans,zh-TW,ja,ko,ru,es,fr,de,pt,it,tr,vi,id,ar,he,hi}.md"
      - "TRANSLATIONS.md"
    license: CC-BY-SA-4.0
    auto_level: full
    trust_level: community
    refresh_cycle: quarterly
    domain: system-design
    related_technologies: [system-design, distributed-systems, interview-prep]
    reference_only: false
    verified: true
    notes: "Actually run. Main content is the root README.md (very large, heading-rich) plus solutions/system_design/*/README.md case studies. solutions/object_oriented_design is code (.py/.ipynb), excluded."

  - name: cp-algorithms
    namespace: technical
    priority: P0
    url: https://github.com/cp-algorithms/cp-algorithms
    loader: git
    path: src
    options:
      # ~80 "Practice problems" link-only lists are dropped as link-index; they are counted in
      # the report but intentionally NOT written to data/reports/dropped/ (pure noise for audit).
      dropped_not_persisted: [link-index]
    license: CC-BY-SA-4.0
    auto_level: full
    trust_level: community
    refresh_cycle: quarterly
    domain: algorithms
    related_technologies: [algorithms, data-structures, competitive-programming]
    reference_only: false
    verified: true
    notes: "Actually run. src/ has 170 md files, mkdocs-based."

  - name: fastapi
    namespace: technical
    priority: P0
    url: https://github.com/fastapi/fastapi
    loader: git
    # docs_src/ holds the code examples that the docs pull in with `{* ../../docs_src/x.py hl[..] *}`.
    # It is fetched (sparse) only so the loader can inline those examples; it is NOT in `include`,
    # so docs_src files are never ingested as standalone chunks.
    paths: ["docs/en", "docs_src"]
    include: ["docs/en/docs/**"]
    options:
      code_include_base: docs/en     # include paths are relative to docs/en (../../docs_src -> <repo>/docs_src)
    exclude:
      # release notes alone were 559 of 1,332 chunks (42%) and are changelog, not Q&A material
      - "docs/en/docs/release-notes.md"
      # project-community / maintainer / translation-process pages
      - "docs/en/docs/{contributing,fastapi-people,management,management-tasks,newsletter,help-fastapi,external-links,translations,translation-banner,_llm-test,project-generation}.md"
      - "docs/en/docs/{about,resources}/**"
    license: MIT
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: web-backend
    related_technologies: [fastapi, python, rest-api]
    reference_only: false
    verified: true
    notes: "Actually run. docs/en has 156 md files (confirmed; docs/ also has 11 other locale dirs, excluded)."

  - name: django
    namespace: technical
    priority: P0
    url: https://github.com/django/django
    loader: git
    # Tree-verified: docs/**/*.txt (676 reST files; Django's non-standard .txt
    # extension). releases/ alone is 396 files.
    paths: ["docs/intro/", "docs/topics/", "docs/howto/", "docs/ref/", "docs/faq/", "docs/glossary.txt"]
    include: ["docs/**/*.txt"]
    exclude:
      - "docs/ref/contrib/gis/**"
      - "docs/howto/{contributing,_images}/**"
      - "docs/**/contents.txt"
    options:
      exts: [".txt"]
    max_file_kb: 300      # docs/ref/models/querysets.txt (QuerySet API reference) is 162 KB
    clean_profile: rst
    license: BSD-3-Clause
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: web-backend
    related_technologies: [django, python, web-framework]
    reference_only: false
    verified: true
    notes: >
      Included: intro/ (tutorials), topics/ (conceptual: ORM, auth, caching,
      migrations...), howto/, ref/ (models, QuerySets, settings, middleware, forms,
      class-based views...), faq/, glossary. Excluded: releases/ (396 release
      notes), internals/ + misc/ (contributor/governance/deprecation timeline),
      _theme/_ext/man (build tooling), ref/contrib/gis (GeoDjango niche).
      reST directives are converted by clean_profile `rst` (code-block ->
      fenced code, :ref:/:class:/:doc: roles -> plain text, versionadded/changed ->
      inline notes, admonitions -> bold labels, toctree/image/module directives
      dropped).

  - name: postgres-docs
    namespace: technical
    priority: P0
    url: https://www.postgresql.org/docs/current/
    loader: crawler
    license: "PostgreSQL License (permissive, similar to MIT/BSD)"
    auto_level: full
    trust_level: official
    refresh_cycle: quarterly
    domain: databases
    related_technologies: [postgresql, sql, pgvector]
    reference_only: false
    verified: true
    clean_profile: html
    options:
      crawl:
        prefix: "https://www.postgresql.org/docs/current/"
        start_urls: ["https://www.postgresql.org/docs/current/index.html"]
        delay_seconds: 1.5          # >= 1s required; politeness margin
        max_pages: 260
        main_selectors: ["#docContent"]
        strip_selectors: [".navheader", ".navfooter", ".id_link", ".indexterm", "#docComments", ".titlepage-nav"]
        version_regex: 'PostgreSQL ([0-9]+\.[0-9]+) Documentation'
        version_prefix: "PostgreSQL "
        # /docs/current/ moves with every release; pin chunk URLs to the major version we crawled
        permalink: {match: "/docs/current/", replace: "/docs/{major}/"}
        # Whitelist of page names (relative to prefix) useful for interview prep:
        # SQL language, indexes, concurrency/MVCC/transactions, performance tuning,
        # internals (storage, WAL, planner, vacuum), replication/HA/backup.
        allow:
          - "tutorial-{transactions,window,fk,views,inheritance,agg,join,table}.html"
          - "sql-syntax*.html"
          - "ddl*.html"
          - "dml*.html"
          - "queries*.html"
          - "datatype.html"
          - "datatype-{numeric,character,datetime,boolean,json,uuid,enum,geometric,net,textsearch,xml,pseudo,money,bit,binary,oid}.html"
          - "arrays.html"
          - "rowtypes.html"
          - "indexes*.html"
          - "mvcc*.html"
          - "transaction-iso.html"
          - "explicit-locking.html"
          - "applevel-consistency.html"
          - "locking-indexes.html"
          - "performance-tips.html"
          - "using-explain.html"
          - "planner-stats*.html"
          - "explicit-joins.html"
          - "populate.html"
          - "non-durability.html"
          - "parallel-*.html"
          - "when-can-parallel-query-be-used.html"
          - "storage*.html"
          - "btree*.html"
          - "gin-intro.html"
          - "gist-intro.html"
          - "brin-intro.html"
          - "routine-vacuuming.html"
          - "routine-reindex.html"
          - "wal*.html"
          - "planner-optimizer.html"
          - "query-path.html"
          - "overview.html"
          - "high-availability.html"
          - "different-replication-solutions.html"
          - "warm-standby*.html"
          - "hot-standby*.html"
          - "logical-replication*.html"
          - "backup*.html"
          - "continuous-archiving.html"
          - "failover.html"
        deny:
          - "release*.html"
          - "functions*.html"
          - "*print*.html"
          - "wal-internals.html"
          - "storage-init.html"
    notes: >
      Generic polite crawler (rag/loaders/crawler_loader.py): robots.txt checked
      (Disallow only /docs/devel/ and non-doc paths), >=1.5s delay, descriptive
      UA, URL-prefix scope, whitelist/deny globs, max_pages cap, raw HTML cached
      in data/raw/postgres-docs/. Main content = #docContent minus navheader/
      navfooter. doc_version taken from the page (e.g. "PostgreSQL 18.6").
      Excluded: per-function reference (functions-*), SQL command reference
      (sql-<command>.html), release notes, client/server config reference.

  - name: redis-docs
    namespace: technical
    priority: P0
    url: https://github.com/redis/docs
    loader: git
    # Tree-verified: content/ (Hugo) is 6000+ files, dominated by Redis
    # Enterprise/Cloud/Kubernetes versioned manuals (rs/7.4, 7.8, 7.22, 8.0,
    # kubernetes/*, rc/*) and RedisVL/AI docs. Only core OSS concept docs taken.
    paths:
      - "content/develop/data-types/"
      - "content/develop/get-started/"
      - "content/develop/pubsub/"
      - "content/develop/using-commands/"
      - "content/develop/programmability/"
      - "content/develop/use-cases/*/_index.md"
      - "content/operate/oss_and_stack/management/"
    include:
      - "content/develop/data-types/**"
      - "content/develop/get-started/**"
      - "content/develop/pubsub/**"
      - "content/develop/using-commands/**"
      - "content/develop/programmability/**"
      - "content/develop/use-cases/*/_index.md"
      - "content/operate/oss_and_stack/management/**"
    exclude:
      - "content/develop/data-types/{json,timeseries,vector-sets}/**"
      - "content/develop/get-started/search-tutorial/**"   # RediSearch module tutorial: multi-KB JSON dumps
      - "content/operate/oss_and_stack/management/optimization/benchmarks/**"
      - "content/operate/oss_and_stack/management/security/gpgkey.txt"
    max_file_kb: 100
    clean_profile: hugo
    license: "Redis docs: CC-BY-SA-4.0 (code samples may differ; verify per-file)"
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: databases
    related_technologies: [redis, caching, nosql]
    reference_only: false
    verified: true
    notes: >
      Real content dir is content/ (Hugo). Interview-relevant subset: core data
      types (strings/hashes/lists/sets/sorted sets/streams/geo/probabilistic),
      getting started, pub/sub, transactions/programmability, command usage, the
      13 use-case pattern pages (cache-aside, rate limiter, session store, job
      queue, leaderboard, streaming...; per-client code dirs excluded) and OSS
      operations (persistence, replication, Sentinel, scaling/cluster, latency,
      memory optimisation, security). Excluded: Redis Enterprise/Cloud/
      Kubernetes manuals (versioned duplicates, thousands of files), RedisVL
      and AI/vector docs, client-library docs, integrations, module-specific
      JSON/TimeSeries/vector-set docs, release notes, benchmarks. Hugo
      shortcodes ({{< >}}/{{% %}}) are stripped by clean_profile `hugo`.

  - name: kafka-docs
    namespace: technical
    priority: P0
    url: https://github.com/apache/kafka
    loader: git
    # Tree-verified: docs/ = 112 Markdown files (Hugo), NOT HTML. Embedded raw
    # HTML (tables/divs/anchors) inside the markdown is converted by the shared
    # HTML->markdown cleaner (clean_profile: hugo).
    paths: ["docs/"]
    include: ["docs/**"]
    exclude:
      - "docs/**/upgrade*"
      - "docs/getting-started/upgrade.md"
      - "docs/**/_index.md"
    max_file_kb: 200
    clean_profile: hugo
    license: Apache-2.0
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: streaming
    related_technologies: [kafka, streaming, event-driven]
    reference_only: false
    verified: true
    notes: >
      Docs are Markdown-in-repo (Hugo), not HTML-in-repo. Config reference pages
      (configuration/*-configs.md) are auto-generated tables and are kept but
      split by headings. Upgrade guides and section _index.md stubs excluded.

  - name: kafka-config-reference
    namespace: technical
    priority: P0
    url: https://github.com/apache/kafka-site
    loader: git
    # The configuration reference tables (producer/consumer/broker/topic/...) are NOT in
    # apache/kafka: its docs pull them in at build time via {{< include-html >}}. The
    # generated HTML lives in apache/kafka-site, content/en/<ver>/generated/ (tree-verified;
    # latest_version "43" per hugo.yaml).
    paths: ["content/en/43/generated/"]
    include:
      - "content/en/43/generated/{kafka_config,producer_config,consumer_config,topic_config,group_config,admin_client_config,streams_config,connect_config}.html"
    options:
      exts: [".html"]
      title_prefix: "Kafka "
      titles: {kafka_config: "Kafka Broker Config"}
    max_file_kb: 400
    clean_profile: html
    license: Apache-2.0
    auto_level: full
    trust_level: official
    refresh_cycle: monthly
    domain: streaming
    related_technologies: [kafka, configuration, producer, consumer]
    reference_only: false
    verified: true
    notes: >
      Fills the gap left by kafka-docs (whose config pages only contain an include-html
      stub). Generated HTML fragments (one <li> per config: name, description, type/
      default/valid values/importance table) are converted to markdown. Only the 8
      most interview-relevant references are taken (broker, producer, consumer, topic,
      group, admin client, streams, connect); metrics/protocol/mirror/transform
      references are excluded. doc_version is the kafka-site commit.

  - name: tech-interview-handbook
    namespace: question
    priority: P0
    url: https://github.com/yangshun/tech-interview-handbook
    loader: git
    paths: ["apps/website/contents", "apps/website/blog"]
    license: MIT
    auto_level: full
    trust_level: community
